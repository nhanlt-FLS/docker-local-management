name: Release

# A new desktop build is published whenever a version tag (v*) is pushed.
# The running app checks these Releases on startup and self-updates.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------ Linux --
  appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches VERSION file
        run: |
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$FILE_VERSION" != "$TAG" ]; then
            echo "::error::VERSION ($FILE_VERSION) does not match pushed tag ($TAG)"
            exit 1
          fi
          echo "Building version $TAG"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (WebKitGTK + GObject introspection)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libgirepository1.0-dev \
            gir1.2-webkit2-4.0 \
            librsvg2-bin \
            imagemagick

      - name: Build AppImage
        run: |
          chmod +x build_desktop.sh
          ./build_desktop.sh
          # Stage the one-file installer under a stable published name.
          cp packaging/install.sh install-docker-local-management.sh
          chmod +x install-docker-local-management.sh
        env:
          ARCH: x86_64

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          # Releases live in the public binaries-only repo; this source repo
          # stays private, so no raw source is ever published.
          repository: nhanlt-FLS/docker-local-management-dist
          token: ${{ secrets.DIST_RELEASE_TOKEN }}
          files: |
            docker-local-management-*.AppImage
            install-docker-local-management.sh
          # Explains which asset is for which OS / which is the one-file setup.
          body_path: packaging/release-notes.md
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------- Windows --
  windows:
    name: Build Windows exe + installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches VERSION file
        shell: pwsh
        run: |
          $file = (Get-Content VERSION -Raw).Trim()
          $tag  = "${{ github.ref_name }}" -replace '^v',''
          if ($file -ne $tag) {
            Write-Error "VERSION ($file) does not match pushed tag ($tag)"
            exit 1
          }
          "APP_VERSION=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build frontend
        shell: pwsh
        run: |
          Push-Location frontend
          npm ci
          npm run build
          Pop-Location

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build portable exe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean desktop.spec
          $ver = "${{ github.ref_name }}" -replace '^v',''
          Copy-Item "dist\docker-local-management.exe" "docker-local-management-$ver-win64.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc).Source }
          & $iscc "packaging\windows-installer.iss"
          $ver = "${{ github.ref_name }}" -replace '^v',''
          Copy-Item "setup-output\docker-local-management-setup-$ver.exe" "."

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          repository: nhanlt-FLS/docker-local-management-dist
          token: ${{ secrets.DIST_RELEASE_TOKEN }}
          files: |
            docker-local-management-*-win64.exe
            docker-local-management-setup-*.exe
          fail_on_unmatched_files: true
